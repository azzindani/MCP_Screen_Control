[project]
name = "mcp-screen-control"
version = "0.1.0"
description = "Local MCP server for desktop screen control via small VLMs"
requires-python = "==3.12.*"
dependencies = [
    "fastmcp>=2.0,<3.0",
    "mss>=9.0",
    "Pillow>=10.0",
    "pyautogui>=0.9.54",
    "httpx>=0.27",
    "psutil>=5.9",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.9",
    "pyright>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]
include = ["_sc_*.py", "engine.py", "server.py", "_sc_helpers.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pyright]
pythonVersion = "3.12"
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
